name: Publish Plugin SDK to npm

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (e.g. latest, beta)"
        required: false
        default: "latest"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm --filter @bowerbird/plugin-sdk... install --frozen-lockfile

      - name: Verify SDK Release Version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        env:
          SDK_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const {version} = JSON.parse(fs.readFileSync("packages/plugin-sdk/package.json", "utf8"));
            if (process.env.SDK_RELEASE_TAG !== `sdk-v${version}`) {
              throw new Error(`Tag ${process.env.SDK_RELEASE_TAG} does not match SDK version ${version}`);
            }
          '

      - name: Typecheck and Build SDK
        run: |
          pnpm --filter @bowerbird/plugin-sdk check
          pnpm --filter @bowerbird/plugin-sdk build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag || 'latest' }}
        run: |
          echo "Publishing @bowerbird/plugin-sdk with tag: $TAG..."
          cd packages/plugin-sdk
          pnpm publish --access public --tag "$TAG" --no-git-checks
