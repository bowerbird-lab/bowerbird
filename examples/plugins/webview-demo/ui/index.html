<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>插件界面测试</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">BOWERBIRD · 插件窗口</p>
    <h1>插件界面已加载</h1>
    <p>这个窗口由插件中的 HTML、CSS 和 JavaScript 绘制。</p>
    <button id="button">测试交互</button>
    <p id="status" aria-live="polite">点击按钮验证 JavaScript 是否运行。</p>
    <button id="read-settings">读取插件设置</button>
    <p id="settings-status" aria-live="polite">在插件设置中编辑测试文字，再点击读取。</p>
    <p class="note">这是界面和配置读取验证，尚未接入素材和网络接口。</p>
  </main>
</body>
</html>
